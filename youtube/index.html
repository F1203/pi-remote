<!doctype html>
<!-- data-pitv-app: la extensión (tv.js) le pasa la cruceta a esta página en vez de navegarla ella -->
<html lang="es" data-pitv-app>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube TV</title>
<!-- La base es la misma que la del modo anime; estilo.css cambia lo propio -->
<link rel="stylesheet" href="../anime/estilo.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="app">
  <header id="barra" data-fila="menu">
    <div class="marca">You<span>Tube</span></div>
    <button class="menu" data-f data-k="m:inicio" data-ir="#/">Inicio</button>
    <button class="menu" data-f data-k="m:buscar" data-ir="#/buscar">Buscar</button>
    <button class="menu" data-f data-k="m:subs" data-ir="#/subs">Suscripciones</button>
    <button class="menu" data-f data-k="m:canales" data-ir="#/canales">Canales</button>
    <button class="menu" data-f data-k="m:historial" data-ir="#/historial">Historial</button>
    <button class="menu" data-f data-k="m:tarde" data-ir="#/tarde">Ver más tarde</button>
    <button class="menu" data-f data-k="m:anime" data-accion="anime">Anime</button>
    <button class="menu" data-f data-k="m:pelis" data-accion="pelis">Pelis</button>
    <div class="pista">Mantené OK: opciones</div>
    <div class="reloj" id="reloj"></div>
  </header>
  <main id="pantalla"></main>
</div>

<div id="reproductor">
  <div class="cargando" id="cargando">Cargando…</div>
  <div id="controles" data-capa>
    <h3 id="c-titulo"></h3>
    <p class="ayuda" id="c-ayuda"></p>
    <div class="botones" data-fila="c1" id="c-botones"></div>
    <div id="c-rel"></div>
  </div>
  <div id="aviso" data-capa>
    <h3 id="a-titulo"></h3>
    <p id="a-texto"></p>
    <div class="botones" data-fila="a1">
      <button class="boton principal" data-f data-accion="siguiente-ya">Ver ahora</button>
      <button class="boton" data-f data-accion="cancelar-siguiente">Cancelar</button>
    </div>
  </div>
</div>

<div id="menu">
  <div class="panel">
    <h3 id="m-titulo"></h3>
    <p id="m-sub"></p>
    <div id="m-opciones"></div>
  </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
